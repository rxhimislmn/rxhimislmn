<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rxhimislmn | Creative Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background: #fff; 
            color: #000;
            line-height: 1.6;
        }

        /* Hero Section */
        .hero-section { 
            padding: 120px 20px 60px; 
            text-align: center; 
        }
        .hero-title { 
            font-size: 2.5rem; 
            font-weight: 700; 
            letter-spacing: -1px;
            margin-bottom: 10px;
        }
        .hero-subtitle {
            font-size: 1rem;
            color: #666;
            font-weight: 300;
        }

        /* Navigation Minimalis (Teks Sahaja) */
        .nav-categories { 
            display: flex; 
            justify-content: center; 
            gap: 60px; 
            padding: 40px 20px;
            border-top: 1px solid #eee;
            max-width: 800px;
            margin: 0 auto;
        }
        .category-text { 
            cursor: pointer; 
            font-size: 0.75rem; 
            font-weight: 700; 
            letter-spacing: 2px; 
            transition: 0.3s;
            color: #888;
            padding-bottom: 5px;
        }
        .category-text:hover, .category-text.active { 
            color: #000;
            border-bottom: 2px solid #000;
        }

        /* Content Drawer */
        #content-drawer { 
            background: #fcfcfc; 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid #eee;
        }
        .drawer-inner { padding: 60px 20px; max-width: 1000px; margin: 0 auto; }
        .tab-panel { display: none; opacity: 0; transition: opacity 0.4s; }
        .tab-panel.show { display: block; opacity: 1; }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .gallery-grid img, .gallery-grid video {
            width: 100%;
            display: block;
            border-radius: 4px;
        }

        /* Footer Professional */
        footer {
            padding: 100px 20px;
            text-align: center;
            border-top: 1px solid #eee;
            margin-top: 50px;
        }
        .copyright {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: #999;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header class="hero-section">
        <h1 class="hero-title">rxhimislmn.</h1>
        <p class="hero-subtitle">Videographer, Animator & Digital Artist</p>
    </header>

    <nav class="nav-categories">
        <div class="category-text" onclick="toggleWork('video', this)">VIDEO</div>
        <div class="category-text" onclick="toggleWork('photo', this)">PHOTO</div>
        <div class="category-text" onclick="toggleWork('arts', this)">ARTS</div>
        <div class="category-text" onclick="toggleWork('motion', this)">MOTION</div>
    </nav>

    <div id="content-drawer">
        <div class="drawer-inner">
            
            <div id="video" class="tab-panel">
                <div class="gallery-grid">
                    <video controls>
                        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

            <div id="photo" class="tab-panel">
                <div class="gallery-grid">
                    <img src="redonebuilding.png" alt="Photography">
                </div>
            </div>

            <div id="arts" class="tab-panel">
                <div class="gallery-grid">
                    <img src="nama-poster-anda.jpg" alt="Digital Arts">
                </div>
            </div>

            <div id="motion" class="tab-panel">
                <p style="text-align: center; color: #999; font-size: 0.8rem;">MOTION PROJECTS COMING SOON</p>
            </div>

        </div>
    </div>

    <footer>
        <div class="copyright">
            © 2026 RXHIMISLMN. ALL RIGHTS RESERVED.
        </div>
    </footer>

    <script>
        function toggleWork(id, element) {
            const drawer = document.getElementById('content-drawer');
            const target = document.getElementById(id);
            const allPanels = document.querySelectorAll('.tab-panel');
            const allBtns = document.querySelectorAll('.category-text');

            // Jika klik pada yang sudah aktif, tutup drawer
            if (element.classList.contains('active')) {
                drawer.style.maxHeight = "0";
                element.classList.remove('active');
                setTimeout(() => { target.classList.remove('show'); }, 600);
            } 
            else {
                // Reset semua
                allBtns.forEach(btn => btn.classList.remove('active'));
                allPanels.forEach(panel => panel.classList.remove('show'));

                // Aktifkan yang baru
                element.classList.add('active');
                target.classList.add('show');
                
                // Buka laci (Auto height)
                drawer.style.maxHeight = "2000px";
            }
        }
    </script>

</body>
</html>
