<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rxhimislmn | Creative Powerhouse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root { --bg: #ffffff; --text: #000000; }
        * { box-sizing: border-box; cursor: none; } /* Kita guna custom cursor nanti */
        
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: var(--text); 
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* CUSTOM CURSOR (Macam BikeBear) */
        #cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: rgba(0,0,0,0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            mix-blend-mode: difference; /* Warna cursor berubah ikut background */
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 0 50px; }

        /* HEADER SECTION */
        header { padding: 120px 0 80px; }
        .brand { font-size: 18px; font-weight: 900; letter-spacing: 2px; margin-bottom: 40px; }
        
        .huge-title { 
            font-size: clamp(3.5rem, 10vw, 8rem); 
            font-weight: 900; 
            line-height: 0.85; 
            letter-spacing: -5px; 
            text-transform: uppercase;
        }

        /* ABOUT ME (STORY) */
        .intro-section { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 100px; 
            margin-bottom: 150px;
            padding-top: 60px;
            border-top: 10px solid #000;
        }
        
        .intro-left h2 { font-size: 32px; font-weight: 900; text-transform: uppercase; }
        .intro-right p { font-size: 1.4rem; line-height: 1.3; font-weight: 400; margin-bottom: 40px; }

        /* WORK NAV (TABS) */
        .work-nav { margin: 150px 0 30px; border-bottom: 2px solid #eee; }
        .nav-item { 
            font-size: clamp(2rem, 6vw, 5rem); 
            font-weight: 900; 
            color: #ddd; 
            transition: 0.4s; 
            display: inline-block; 
            margin-right: 50px; 
            text-transform: uppercase;
            text-decoration: none;
            padding-bottom: 10px;
        }
        .nav-item:hover, .nav-item.active { color: #000; letter-spacing: 5px; }

        /* DISPLAY BOX (DRAWER) */
        #drawer { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 1s cubic-bezier(0.86, 0, 0.07, 1);
            background: #000;
            color: #fff;
        }
        .drawer-content { padding: 100px 50px; }

        /* GALLERY */
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }
        img, video { width: 100%; filter: grayscale(100%); transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1); }
        img:hover, video:hover { filter: grayscale(0%); transform: scale(1.05); }

        /* FOOTER */
        footer { 
            padding: 100px 0; 
            display: flex; 
            justify-content: space-between;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            border-top: 10px solid #000;
        }

        @media (max-width: 768px) {
            .intro-section { grid-template-columns: 1fr; gap: 50px; }
            * { cursor: auto; } #cursor { display: none; }
        }
    </style>
</head>

            </div>
        </section>
