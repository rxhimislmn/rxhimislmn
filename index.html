<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rxhimislmn | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* SAYA LETAK SEMUA STYLE KAT SINI SUPAYA TAK KACAU FAIL STYLE.CSS LAMA */
        body { font-family: 'Inter', sans-serif; margin: 0; background: #fff; }
        .hero-section { text-align: center; padding: 60px 20px; }
        .hero-title { font-size: 3rem; font-weight: 800; margin: 0; }
        
        .nav-container { display: flex; justify-content: center; gap: 50px; padding: 30px; border: 1px solid #eee; border-radius: 20px 20px 0 0; max-width: 900px; margin: 0 auto; }
        
        .icon-btn { cursor: pointer; text-align: center; transition: 0.3s; padding: 10px; min-width: 80px; }
        .icon-btn i { font-size: 28px; display: block; margin-bottom: 10px; color: #000; }
        .icon-btn span { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #000; }
        .icon-btn:hover { transform: translateY(-5px); }

        #black-drawer { 
            background: #111; 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.5s ease-out; 
            max-width: 922px; 
            margin: 0 auto; 
            border-radius: 0 0 20px 20px;
        }
        .content-padding { padding: 40px; color: white; }
        .tab-content { display: none; text-align: center; }
        
        .work-grid { max-width: 1000px; margin: 50px auto; padding: 0 20px; }
        .card { background: #000; color: white; border-radius: 20px; overflow: hidden; padding: 20px; }
        img, video { width: 100%; border-radius: 10px; }
    </style>
</head>
<body>

    <header class="hero-section">
        <h1 class="hero-title">rxhimislmn.</h1>
        <p>Videographer, Animator & Digital Artist</p>
    </header>

    <div class="nav-container">
        <div class="icon-btn" onclick="openMe('vids')">
            <i class="fa-solid fa-video"></i>
            <span>VIDEO</span>
        </div>
        <div class="icon-btn" onclick="openMe('pics')">
            <i class="fa-solid fa-camera"></i>
            <span>PHOTO</span>
        </div>
        <div class="icon-btn" onclick="openMe('arts')">
            <i class="fa-solid fa-palette"></i>
            <span>ARTS</span>
        </div>
        <div class="icon-btn" onclick="openMe('mots')">
            <i class="fa-solid fa-rocket"></i>
            <span>MOTION</span>
        </div>
    </div>

    <div id="black-drawer">
        <div class="content-padding">
            
            <div id="vids" class="tab-content">
                <h3>📽️ VIDEO WORKS</h3>
                <video controls><source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4"></video>
            </div>

            <div id="pics" class="tab-content">
                <h3>📸 PHOTOGRAPHY</h3>
                <img src="redonebuilding.png">
            </div>

            <div id="arts" class="tab-content">
                <h3>🎨 DIGITAL ARTS</h3>
                <img src="poster1.jpg"> 
            </div>

            <div id="mots" class="tab-content">
                <h3>🚀 MOTION GRAPHICS</h3>
                <p>Coming Soon...</p>
            </div>

        </div>
    </div>

    <section class="work-grid">
        <div class="card">
            <p style="font-size: 12px; color: #888;">FEATURED WORK</p>
            <h2>Showreel 2024</h2>
            <video autoplay loop muted playsinline>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <script>
        function openMe(id) {
            var drawer = document.getElementById('black-drawer');
            var target = document.getElementById(id);
            var all = document.getElementsByClassName('tab-content');

            // Kalau tab tu dah terbuka, kita tutup laci
            if (target.style.display === "block") {
                drawer.style.maxHeight = "0";
                setTimeout(function(){ target.style.display = "none"; }, 500);
            } 
            // Kalau belum terbuka
            else {
                // Sembunyikan semua content dulu
                for (var i = 0; i < all.length; i++) {
                    all[i].style.display = "none";
                }
                // Tunjukkan content yang kita nak
                target.style.display = "block";
                // Buka laci
                drawer.style.maxHeight = "1000px";
            }
        }
    </script>

</body>
</html>
